<div class="flex flex-col h-[100dvh] overflow-hidden bg-slate-50 md:flex-row">
  <!-- Mobile Sidebar Overlay Backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 md:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Sidebar -->
  <app-sidebar [isOpen]="sidebarOpen()" (closeSidebar)="closeSidebar()" />

  <!-- Main Content Column -->
  <div class="flex-1 flex flex-col min-h-0">
    <!-- Header (desktop only) -->
    <div class="hidden md:block flex-shrink-0">
      <app-header (toggleSidebar)="toggleSidebar()" />
    </div>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-20 md:pb-6 custom-scroll">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <app-bottom-nav />
</div>
