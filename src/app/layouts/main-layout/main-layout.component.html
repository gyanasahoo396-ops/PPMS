<div class="flex h-screen overflow-hidden bg-slate-50">
  <!-- Mobile Sidebar Overlay Backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 md:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Sidebar -->
  <app-sidebar [isOpen]="sidebarOpen()" (closeSidebar)="closeSidebar()" />

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 relative">
    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()" />

    <!-- Content Container -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-6 custom-scroll">
      <router-outlet />
    </main>
  </div>
</div>
