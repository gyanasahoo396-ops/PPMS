<div class="space-y-6">
    <div class="bg-amber-50 p-4 rounded-lg border-l-4 border-amber-500 shadow-sm">
        <p class="text-sm text-amber-800">
            <strong>High Visibility Projects:</strong> These projects have been tagged as "HM Committed". Priority
            tracking ensures these are completed within the announced timelines.
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let project of priorityProjects"
            class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200 hover:shadow-md transition-shadow">
            <div class="h-32 bg-slate-200 flex items-center justify-center relative">
                <i class="fa-solid fa-star text-4xl text-white opacity-50"></i>
                <div class="absolute top-2 right-2 bg-amber-500 text-white text-xs font-bold px-2 py-1 rounded shadow">
                    HM Committed
                </div>
            </div>
            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-base font-bold text-slate-800 leading-tight">{{ project.name }}</h3>
                </div>
                <p class="text-xs text-slate-500 mb-4">{{ project.dept }} | {{ project.loc }}</p>

                <div class="space-y-3">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-500">Physical Progress</span>
                            <span class="font-bold text-slate-700">{{ project.physical }}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5">
                            <div class="bg-indigo-600 h-1.5 rounded-full" [style.width.%]="project.physical"></div>
                        </div>
                    </div>
                </div>

                <button (click)="openProjectDetails(project.id)"
                    class="w-full mt-4 py-2 bg-slate-50 text-slate-700 hover:bg-slate-100 text-sm font-medium rounded-lg border border-slate-200 transition-colors">
                    Check Status
                </button>
            </div>
        </div>
    </div>
</div>
