<header class="bg-white shadow-sm h-16 flex items-center justify-between px-4 md:px-8 z-10">
    <button class="md:hidden text-slate-600 focus:outline-none" (click)="toggleSidebar()">
        <i class="fa-solid fa-bars text-xl"></i>
    </button>
    <h2 class="text-xl font-bold text-slate-800">{{ pageTitle }}</h2>
    <div class="flex items-center space-x-4">
        <button class="p-2 text-slate-400 hover:text-indigo-600 transition-colors relative">
            <i class="fa-solid fa-bell"></i>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        
        @if (currentUser()) {
            <div class="flex items-center space-x-3 border-l border-slate-200 pl-4">
                <!-- User Info -->
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-semibold text-slate-700">{{ currentUser()!.displayName }}</p>
                    <div class="flex items-center justify-end space-x-2">
                        <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                            [class.bg-purple-100]="currentUser()!.role === 'minister'"
                            [class.text-purple-700]="currentUser()!.role === 'minister'"
                            [class.bg-blue-100]="currentUser()!.role === 'admin'"
                            [class.text-blue-700]="currentUser()!.role === 'admin'"
                            [class.bg-green-100]="currentUser()!.role === 'manager'"
                            [class.text-green-700]="currentUser()!.role === 'manager'"
                            [class.bg-gray-100]="currentUser()!.role === 'viewer'"
                            [class.text-gray-700]="currentUser()!.role === 'viewer'">
                            {{ currentUser()!.role.toUpperCase() }}
                        </span>
                    </div>
                </div>
                
                <!-- User Avatar & Logout -->
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-r from-orange-500 to-blue-600 flex items-center justify-center text-white font-semibold">
                        {{ currentUser()!.displayName.charAt(0).toUpperCase() }}
                    </div>
                    <button 
                        (click)="logout()"
                        class="p-2 text-slate-500 hover:text-red-600 transition-colors"
                        title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        } @else {
            <div class="text-right hidden sm:block">
                <p class="text-xs text-slate-500">Last Updated</p>
                <p class="text-sm font-semibold text-slate-700">{{ currentDate }}</p>
            </div>
        }
    </div>
</header>
