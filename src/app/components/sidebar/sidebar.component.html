<aside
  class="h-full bg-gradient-to-b from-brand-900 to-indigo-950 text-white flex-shrink-0 flex flex-col transition-transform duration-300 z-40 shadow-professional-xl"
  [class.sidebar-open]="isOpen"
  [class.sidebar-closed]="!isOpen">

  <!-- Sidebar Header -->
  <div class="p-6 border-b border-white/10 flex items-center space-x-3">
    <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-brand-700 font-bold text-xl shadow-lg flex-shrink-0">
      <i class="fa-solid fa-landmark"></i>
    </div>
    <div class="min-w-0">
      <h1 class="text-lg font-bold leading-tight tracking-tight truncate">Dhamnagar</h1>
      <p class="text-xs text-brand-200">Constituency Monitor</p>
    </div>
    <!-- Close button (mobile only) -->
    <button
      class="ml-auto md:hidden text-white/70 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors flex-shrink-0"
      (click)="closeSidebar.emit()"
      aria-label="Close sidebar">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 custom-scroll">
    <ul class="space-y-1.5 px-3">
      <li>
        <a routerLink="/dhamnagar-dashboard/dashboard" routerLinkActive="bg-white/10 text-white shadow-sm"
          (click)="onLinkClick()"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-brand-100 hover:text-white group">
          <i class="fa-solid fa-chart-line w-5 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">HM Decision Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/dhamnagar-dashboard/departments" routerLinkActive="bg-white/10 text-white shadow-sm"
          (click)="onLinkClick()"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-brand-100 hover:text-white group">
          <i class="fa-solid fa-building-columns w-5 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Department Wise</span>
        </a>
      </li>
      <li>
        <a routerLink="/dhamnagar-dashboard/priorities" routerLinkActive="bg-white/10 text-white shadow-sm"
          (click)="onLinkClick()"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-brand-100 hover:text-white group">
          <i class="fa-solid fa-star w-5 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">HM Priorities</span>
        </a>
      </li>
      <li>
        <a routerLink="/dhamnagar-dashboard/intervention" routerLinkActive="bg-white/10 text-white shadow-sm"
          (click)="onLinkClick()"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all text-brand-100 hover:text-white group">
          <i class="fa-solid fa-flag w-5 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Projects Requiring Intervention</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User Profile & Logout Section -->
  @if (currentUser()) {
    <div class="p-4 border-t border-white/10 space-y-3 bg-black/10">
      <!-- User Info -->
      <div class="flex items-center space-x-3 pb-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-brand-400 to-indigo-500 flex items-center justify-center font-bold text-sm flex-shrink-0 shadow-md">
          {{ currentUser()!.displayName.charAt(0).toUpperCase() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">{{ currentUser()!.displayName }}</p>
          <p class="text-xs text-brand-200 truncate">{{ currentUser()!.role.toUpperCase() }}</p>
        </div>
      </div>

      <!-- Logout Button -->
      <button
        (click)="logout()"
        [disabled]="isLoggingOut()"
        class="w-full flex items-center justify-center space-x-2 px-3 py-2.5 text-sm font-semibold bg-white/5 hover:bg-red-600 rounded-xl transition-all duration-200 text-white disabled:opacity-50 disabled:cursor-not-allowed border border-white/10 hover:border-red-600 shadow-sm">
        @if (isLoggingOut()) {
          <i class="fa-solid fa-spinner animate-spin"></i>
          <span>Signing Out...</span>
        } @else {
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sign Out</span>
        }
      </button>
    </div>
  }
</aside>
